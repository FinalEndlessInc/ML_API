<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manejo monstruo</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/managemonstergram.css">
</head>
<body>

    <nav>
        <div id="LogoPagina">
            <img src="img/ml_api.png" alt="Logo">
        </div>
        <div id="EnlacesSuperior">
            <a href="index.html" class="enlaces_encabezado">Home</a>
            <a href="" class="enlaces_encabezado">Monstergram</a>
            <a href="" class="enlaces_encabezado">Documentation</a>
            <a href="ManageMonstergram.html" id="EditarMonstruo">+</a>
        </div>
    </nav>

    <div id="apartado_editar" style="display:block">
        <div>Search a monster to edit: </div>
        <input type="text">
        <button onclick="BuscarMonstruo()">Search</button>
        <div id="Cargar_busqueda">
            <div>Name:</div>
            <input type="text" class="nombre">

            <div>ID: </div>
            <input type="text" class="numero">

            
            <label for="elementos">Elements:</label>
            <select name="elementos" class="elementos" id="element1">
                <option value="Fire">Fire</option>
                <option value="Nature">Nature</option>
                <option value="Earth">Earth</option>
                <option value="Thunder">Thunder</option>
                <option value="Water">Water</option>
                <option value="Dark">Dark</option>
                <option value="Magic">Magic</option>
                <option value="Light">Light</option>
                <option value="Special">Special</option>
                <option value="Metal">Metal</option>
            </select>

            <select name="elementos" class="elementos" id="element2">
                <option value="None">None</option>
                <option value="Fire">Fire</option>
                <option value="Nature">Nature</option>
                <option value="Earth">Earth</option>
                <option value="Thunder">Thunder</option>
                <option value="Water">Water</option>
                <option value="Dark">Dark</option>
                <option value="Magic">Magic</option>
                <option value="Light">Light</option>
                <option value="Special">Special</option>
                <option value="Metal">Metal</option>
            </select>

            <div> Description:</div>
            <textarea class="Descripcion" rows="4" cols="50"></textarea>

            <label for="rareza">Rarity: </label>
            <select name="rareza" id="Rareza">
                <option value="Common">Common</option>
                <option value="Uncommon">Uncommon</option>
                <option value="Rare">Rare</option>
                <option value="Epic">Epic</option>
                <option value="Legendary">Legendary</option>
                <option value="Mythic">Mythic</option>
                <option value="Arquitect">Arquitect</option>
            </select>

            <div id="ContenedorReliquias">
                <div id="PlantillaReliquia">
                    <label for="reliquias" class="Reliquia">Relics</label>
                    <select name="reliquias" id="reliquia1" class="reliquias">
                        <option value="Sword">Sword</option>
                        <option value="Mask">Mask</option>
                        <option value="Essence">Essence</option>
                        <option value="Amulet">Amulet</option>
                        <option value="Trap">Trap</option>
                        <option value="Staff">Staff</option>
                        <option value="Armor">Armor</option>
                        <option value="Shield">Shield</option>
                        <option value="Banner">Banner</option>
                    </select>
                    
                    <select name="reliquias" id="reliquia2" class="reliquias">
                        <option value="None">None</option>
                        <option value="Sword">Sword</option>
                        <option value="Mask">Mask</option>
                        <option value="Essence">Essence</option>
                        <option value="Amulet">Amulet</option>
                        <option value="Trap">Trap</option>
                        <option value="Staff">Staff</option>
                        <option value="Armor">Armor</option>
                        <option value="Shield">Shield</option>
                        <option value="Banner">Banner</option>
                    </select>

                    <select name="talentos" id="talentos">
                        <option value="None">None</option>
                        <option value="Obscure Talents">Obscure Talents</option>
                        <option value="Street Talents">Street Talents</option>
                        <option value="Doomed Talents">Doomed Talents</option>
                        <option value="Blossom Talents">Blossom Talents</option>
                        <option value="Galactic Talents">Galactic Talents</option>

                    </select>
                </div>
            </div>

            <div id="ContenedorStadisticas">
                <div class="PlantillaStats">
                    <div class="RangoEstadisticas">
                        <div class="Rango">Rank 0</div>
                        <input type="number" class="Life"><br>
                        <input type="number" class="Power"><br>
                        <input type="number" class="Speed"><br>
                        <input type="number" class="Stamina"><br>
                        <input type="number" class="Gold"><br>
                    </div>
                </div>
            </div>

            <div id="ContenedorHabilidades">
                <div class="PlantillaHabilidad">
                    <input type="text" name="" class="ss_nombre">
                    <textarea class="ss_descripcion" rows="4" cols="50"></textarea>
                    <input type="text" name="" class="ss_tipo">
                    <input type="text" name="" class="ss_objetivo">
                    <div class="EfectosHabilidad">
                        <!--input type="text" name="" class="Efectos"-->
                    </div>
                    <input type="number" name="" class="ss_precision">
                    <input type="number" name="" class="ss_danio">
                    <input type="number" name="" class="ss_costo">
                    <input type="number" name="" class="ss_recuperacion">
                </div>

                <div id="habilidad_ult">
                    <p>Ult</p>
                    <input type="text" id="ult_nombre">
                    <textarea id="ult_descripcion" rows="4" cols="50"></textarea>
                    <input type="text" id="ult_objetivo">
                    <!--input type="text" id="ult_efectos"-->
                </div>
            </div>



            <div class="SubirImagenesMonstruos">
                <h2>Adult/Main Image</h2>
                <input type="file" id="ImagenPrincipal">
                <img id="PreviewImagenPrincipal"><br>

                <h2>Teen Image (Optional)</h2>
                <input type="file" id="ImagenTeen">
                <img id="PreviewImagenTeen"><br>

                <h2>Baby Image</h2>
                <input type="file" id="ImagenBebe">
                <img id="PreviewImagenBebe"><br>

                <h2>Egg Image</h2>
                <input type="file" id="ImagenHuevo">
                <img id="PreviewImagenHuevo"><br>

                <!--button id="BotonEditar" onclick="CambiarMonstruo()">Actualizar</button--><br>
            </div>
        </div>

        
        

        

    </div>
</body>
<script src="js/global.js"></script>
<script src="js/ManageMonstergram.js"></script>
</html>
